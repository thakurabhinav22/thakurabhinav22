<style>
.keyColor {fill: #953800;}
.valueColor {fill: #0a3069;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.commentColor {fill: #8b949e;}
text, tspan {white-space: pre;}

@keyframes splashLogo {
    0%   { transform: translate(455px, 0px) scale(0.1); opacity: 0; }
    20%  { transform: translate(455px, 0px) scale(1.5); opacity: 1; }
    60%  { transform: translate(455px, 0px) scale(1.5); opacity: 1; }
    90%  { transform: translate(455px, 0px) scale(3.5); opacity: 0; }
    100% { transform: translate(455px, 0px) scale(0); opacity: 0; }
}
@keyframes uncover {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
}
.ascii {
    transform-origin: center;
    animation: splashLogo 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
.cover {
    transform-origin: right;
    transform: scaleX(1);
    animation: uncover 0.05s steps(76) forwards;
}
.cover-0 { animation-delay: 2.30s; }
.cover-1 { animation-delay: 2.35s; }
.cover-2 { animation-delay: 2.40s; }
