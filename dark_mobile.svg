<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Andale Mono,AndaleMono,Consolas,monospace" viewBox="0 0 700 570" width="100%" height="auto" font-size="16px">
<style>
.keyColor {fill: #ffa657;}
.valueColor {fill: #a5d6ff;}
.addColor {fill: #3fb950;}
.delColor {fill: #f85149;}
.commentColor {fill: #8b949e;}
text, tspan {
    white-space: pre;
    font-family: "Andale Mono", Consolas, monospace;
    font-size: 16px;
}
@keyframes introFade {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
}
.intro-splash {
    opacity: 0;
    animation: introFade 1.5s ease-in-out both;
}
@keyframes slideLogo {
    0% { transform: translateX(400px); opacity: 0; }
    10% { transform: translateX(400px); opacity: 1; }
    30% { transform: translateX(400px); opacity: 1; }
    100% { transform: translateX(0px); opacity: 1; }
}
.ascii {
    opacity: 0;
    animation: slideLogo 1.5s cubic-bezier(0.25, 1, 0.5, 1) both;
    animation-delay: 1.5s;
}
@keyframes uncover {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
}
.cover {
    transform-origin: right;
    transform: scaleX(1);
    animation: uncover 0.05s steps(100) both;
}
.cover-0 { animation-delay: 2.25s; }
.cover-1 { animation-delay: 2.50s; }
.cover-2 { animation-delay: 2.52s; }
.cover-3 { animation-delay: 2.57s; }
.cover-4 { animation-delay: 2.59s; }
.cover-5 { animation-delay: 2.84s; }
.cover-6 { animation-delay: 2.92s; }
.cover-7 { animation-delay: 3.17s; }
.cover-8 { animation-delay: 3.19s; }
.cover-9 { animation-delay: 3.24s; }
.cover-10 { animation-delay: 3.29s; }
.cover-11 { animation-delay: 3.39s; }
.cover-12 { animation-delay: 3.49s; }
.cover-13 { animation-delay: 3.51s; }
.cover-14 { animation-delay: 3.61s; }
.cover-15 { animation-delay: 3.69s; }
.cover-16 { animation-delay: 3.77s; }
.cover-17 { animation-delay: 3.82s; }
.cover-18 { animation-delay: 3.90s; }
.cover-19 { animation-delay: 3.98s; }
.cover-20 { animation-delay: 4.00s; }
.cover-21 { animation-delay: 4.10s; }
.cover-22 { animation-delay: 4.20s; }
.cover-23 { animation-delay: 4.28s; }
.cover-24 { animation-delay: 4.38s; }
.cover-25 { animation-delay: 4.46s; }
.cover-26 { animation-delay: 4.54s; }

@keyframes popIn {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
}
.window-btn {
    animation: popIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) both;
    transform-box: fill-box;
    transform-origin: center;
}
.btn-red { animation-delay: 1.5s; }
.btn-yellow { animation-delay: 1.6s; }
.btn-green { animation-delay: 1.7s; }




@keyframes randomFlicker {
    0%, 90% { opacity: 1;  }
    91% { opacity: 0.8;  }
    92% { opacity: 1;  }
    94% { opacity: 0.5;  }
    96% { opacity: 1;  }
    97% { opacity: 0.7;  }
    99%, 100% { opacity: 1;  }
}
.flicker {
    animation: randomFlicker 12s infinite;
    animation-delay: 5s;
}

@keyframes scanlineFlicker {
    0%, 90% { opacity: 0; }
    91% { opacity: 1; }
    92% { opacity: 0; }
    94% { opacity: 1; }
    96% { opacity: 0; }
    97% { opacity: 1; }
    99%, 100% { opacity: 0; }
}
.scanline-overlay {
    animation: scanlineFlicker 12s infinite;
    animation-delay: 5s;
    opacity: 0;
}

@keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
@keyframes cursorHide {
    to { opacity: 0; }
}
.cursor {
    animation: cursorBlink 0.8s step-end 10, cursorHide 0.1s 8s forwards;
}


@keyframes moveCursor {
    0% { transform: translateX(0); opacity: 0; }
    1% { transform: translateX(0); opacity: 1; }
    99% { transform: translateX(685px); opacity: 1; }
    100% { transform: translateX(695px); opacity: 0; }
}
.typing-cursor {
    animation: moveCursor 0.05s linear both;
}

</style>
